name: CI run on PR
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # The required checks also run in the merge queue: the tested commit is what lands on main
  merge_group:

env:
  # Golang version to use across CI steps
  GOLANG_VERSION: '1.23' # As we have go toolchain 1.23 specified in go.mod

permissions:
  contents: read

jobs:
  check-go:
    name: Ensure Go modules synchronicity
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@8410ad0602e1e429cee44a835ae9f77f654a6694 # v4.0.0
      - name: Setup Golang
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: ${{ env.GOLANG_VERSION }}
      - name: Download all Go modules
        run: |
          go mod download
      - name: Check for tidiness of go.mod and go.sum
        run: |
          go mod tidy
          git diff --exit-code -- .

  lint-go:
    name: Lint Go code
    runs-on: ubuntu-22.04
    permissions:
      contents: read # for actions/checkout to fetch code
      pull-requests: read # for golangci/golangci-lint-action to fetch pull requests
    steps:
      - name: Checkout code
        uses: actions/checkout@8410ad0602e1e429cee44a835ae9f77f654a6694 # v4.0.0
      - name: Setup Golang
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: ${{ env.GOLANG_VERSION }}
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Built with go install (from the Go module proxy) instead of downloaded from GitHub releases
          version: v2.15.0
          install-mode: goinstall
          args: --verbose

  integrationtests:
    name: Run integration tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@8410ad0602e1e429cee44a835ae9f77f654a6694 # v4.0.0
      - name: Setup Golang
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: ${{ env.GOLANG_VERSION }}
      # Uses the docker compose plugin of the runner, instead of a download from GitHub releases
      - name: compose
        run: |
          docker compose version
      - name: vault
        run: |
          docker compose up -d vault
      - name: Integration tests
        run: |
          make integration-tests
        env:
          PGC_TEST_ROOT_TOKEN: pgcustodian
          VAULT_ADDR: http://127.0.0.1:8200

  unittests:
    name: Run unittests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@8410ad0602e1e429cee44a835ae9f77f654a6694 # v4.0.0
      - name: Setup Golang
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: ${{ env.GOLANG_VERSION }}
      # Uses the docker compose plugin of the runner, instead of a download from GitHub releases
      - name: compose
        run: |
          docker compose version
      - name: vault
        run: |
          docker compose up -d vault
      - name: Unit tests
        run: |
          make test-coverage
        env:
          PGC_TEST_ROOT_TOKEN: pgcustodian
          VAULT_ADDR: http://127.0.0.1:8200
      - name: Check test coverage
        uses: vladopajic/go-test-coverage@6890500b00a7e5862e54662c04ea9fa7c799ce1e # v2.23.0
        with:
          config: .testcoverage.yml
          profile: cover.out

  # The only required check of this workflow, so the ruleset doesn't change when jobs are added. It must always run,
  # and only passes when every job it needs succeeded (a skipped required check would count as a pass).
  ci-result:
    name: CI result
    runs-on: ubuntu-latest
    needs:
      - check-go
      - lint-go
      - integrationtests
      - unittests
    if: always()
    steps:
      - name: Evaluate the results
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "Results: ${RESULTS}"
          if [ "$(echo "${RESULTS}" | jq -r 'all(. == "success")')" != true ]; then
            echo "::error::All CI jobs must succeed"
            exit 1
          fi
